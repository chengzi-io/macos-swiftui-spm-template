version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    # fix: Sparkle ships inside the app, and only feat and fix make a release that gets
    # its update to users.
    commit-message:
      prefix: fix
      include: scope
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
