version: 2
updates:
  # Security updates only: a routine bump would arrive as a fix(deps) line in the next
  # release's notes for nothing. A security advisory still opens a pull request. To take
  # routine bumps again, raise the limit and allow the packages that ship.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
