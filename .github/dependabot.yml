version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    # Only the packages that ship inside the app. fix, because only feat and fix make a
    # release that gets its update to users; a test-only package's bump, and its
    # transitive pins, would ship a patch release with nothing in it. Swift names a
    # package by its repository URL, and a package listed here is the only one updated.
    allow:
      - dependency-name: github.com/sparkle-project/sparkle
    commit-message:
      prefix: fix
      include: scope
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
