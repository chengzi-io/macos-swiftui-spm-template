name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Until the one-time setup is done (.agents/skills/release-setup), and in a new repository made from
  # the template before init, every push to main would fail; skip with a notice instead.
  setup:
    name: Check release setup
    runs-on: ubuntu-latest
    # The App's key is a secret of this environment, which only protected branches reach.
    environment: release
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: App/Configs/Identity.xcconfig
          sparse-checkout-cone-mode: false
      - id: check
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          identity_repo=$(sed -nE 's/^GITHUB_REPOSITORY[[:space:]]*=[[:space:]]*([^[:space:]]*).*/\1/p' App/Configs/Identity.xcconfig)
          if [[ -z $CLIENT_ID || -z $PRIVATE_KEY ]]; then
            echo "::notice::Release skipped: set the variable RELEASE_APP_CLIENT_ID and the release environment's secret RELEASE_APP_PRIVATE_KEY (release-setup skill, step 2)"
            configured=false
          elif [[ ${identity_repo,,} != "${GITHUB_REPOSITORY,,}" ]]; then
            echo "::notice::Release skipped: App/Configs/Identity.xcconfig has GITHUB_REPOSITORY = ${identity_repo:-(empty)}, not $GITHUB_REPOSITORY: initialize the project first"
            configured=false
          else
            configured=true
          fi
          echo "configured=$configured" >>"$GITHUB_OUTPUT"

  release-please:
    name: Release please
    needs: setup
    if: ${{ needs.setup.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish macOS app
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    # Same runner and Xcode as CI.
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      # Same step as in ci.yml: .xcode-version is the one place the Xcode version is written.
      - name: Select Xcode from .xcode-version
        run: |
          xcode_version=$(tr -d '[:space:]' <.xcode-version)
          developer_dir="/Applications/Xcode_$xcode_version.app/Contents/Developer"
          [[ -d $developer_dir ]] || { echo "::error::Xcode $xcode_version (.xcode-version) is not installed on this runner"; exit 1; }
          echo "DEVELOPER_DIR=$developer_dir" >>"$GITHUB_ENV"
          sudo DEVELOPER_DIR="$developer_dir" xcodebuild -runFirstLaunch
          sw_vers
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
      - run: make doctor
      # Before the credentials: the tests run the package's dependencies' code.
      - run: make lint test
      - name: Import signing credentials
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: scripts/ci-keychain.sh setup
      - name: Build, sign, notarize, package
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: make release
      - name: Upload assets and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-github.sh "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsym-${{ needs.release-please.outputs.tag_name }}
          path: dist/*.dSYM.zip
          retention-days: 90
      - name: Remove signing credentials
        if: always()
        run: scripts/ci-keychain.sh cleanup
