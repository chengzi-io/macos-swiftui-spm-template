name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build
    # release-please PRs only touch version.txt, CHANGELOG.md and the manifest. A skipped
    # job still satisfies the required check; the same-repo guard keeps forks from skipping.
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: .build
          key: build-${{ runner.os }}-xcode-26.2-${{ hashFiles('Package.resolved') }}
          restore-keys: build-${{ runner.os }}-xcode-26.2-
      - run: make ci

  release-dry-run:
    name: Release dry run
    # Merging a release-please PR tags the release, so its release path must work first.
    # The PR opens as a draft, which cannot merge; marking it ready for review starts the
    # dry run, so it runs when you release rather than on every push to main. Until the
    # PR merges, each release-please update to it runs the dry run again.
    # PRs get no signing secrets: ad-hoc signed, not notarized, no appcast.
    if: ${{ startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: .build
          key: build-${{ runner.os }}-xcode-26.2-${{ hashFiles('Package.resolved') }}
          restore-keys: build-${{ runner.os }}-xcode-26.2-
      # A designed DMG (Bundle/DMG) is built with dmgbuild, which needs Python 3.10+.
      - uses: actions/setup-python@v7
        if: ${{ hashFiles('Bundle/DMG/settings.py') != '' }}
        with:
          python-version: '3.13'
      - run: make release-dry-run
