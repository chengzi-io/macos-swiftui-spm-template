name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build
    # release-please PRs only touch version.txt, CHANGELOG.md and the manifest. A skipped
    # job still satisfies the required check; the same-repo guard keeps forks from skipping.
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository) }}
    # The macOS major the view snapshots were recorded on; other versions draw controls
    # differently. Move it with the Mac that records them.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
          key: build-${{ runner.os }}-xcode-26.2-${{ hashFiles('**/Package.resolved') }}
          restore-keys: build-${{ runner.os }}-xcode-26.2-
      - run: make ci
      # UI tests drive the mouse and keyboard; macOS asks for an admin password the
      # first time unless automation mode is enabled up front.
      - run: sudo automationmodetool enable-automationmode-without-authentication
      - run: make test:ui
