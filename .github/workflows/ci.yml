name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build
    # release-please PRs only touch version.txt, CHANGELOG.md and the manifest. A skipped
    # job still satisfies the required check, so only release-please's own PRs skip: its
    # App opens them as a Bot, while a person's or an agent's token opens them as a User,
    # and the same-repo guard keeps forks out.
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.type == 'Bot' && github.event.pull_request.head.repo.full_name == github.repository) }}
    # The macOS major the view snapshots were recorded on; other versions draw controls
    # differently. Move it with the Mac that records them.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
          key: build-${{ runner.os }}-xcode-26.3-${{ hashFiles('**/Package.resolved') }}
          restore-keys: build-${{ runner.os }}-xcode-26.3-
      - run: make ci
        env:
          # A snapshot test that fails writes the image it drew here.
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: snapshot-failures
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
      # UI tests drive the mouse and keyboard; macOS asks for an admin password the
      # first time unless automation mode is enabled up front.
      - run: sudo automationmodetool enable-automationmode-without-authentication
      - run: make test:ui

  scripts:
    name: Lint scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned releases, checked against their published digests, so a new version's
      # findings arrive as a reviewed bump rather than a red PR.
      - name: Install shellcheck and actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256sum -c <<'EOF'
          b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  shellcheck-v0.11.0.linux.x86_64.tar.gz
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz
          EOF
          tar -xzf shellcheck-v0.11.0.linux.x86_64.tar.gz --strip-components 1 shellcheck-v0.11.0/shellcheck
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          echo "$PWD" >>"$GITHUB_PATH"
      # Follows each script's `source` of common.sh; info and style findings stay advice.
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck --external-sources --source-path=SCRIPTDIR --severity=warning
      # Also runs shellcheck over every workflow's run: steps.
      - run: actionlint
