# Git hooks. `make setup` installs them; run `LEFTHOOK=0 git commit` to skip.
# Commit messages are checked in CI on the PR title (squash merge uses it).
#
# lefthook's `**/` only matches nested paths, so every glob needs both the
# root-level and the nested pattern.
pre-commit:
  jobs:
    - name: swift-format
      run: swift format format --in-place {staged_files}
      glob:
        - "*.swift"
        - "**/*.swift"
      stage_fixed: true
